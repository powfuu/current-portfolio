@if ((isModalOpen$ | async)) {
  <div class="modal-backdrop" (click)="closeModal()" @backdropFade></div>

  <div class="modal-wrap" (click)="closeModal()" @sheetReveal>
    <div class="modal-sheet" (click)="$event.stopPropagation()">

      <!-- Hero image -->
      <div class="project-hero">
        <img loading="lazy" [class]="project.className" [src]="project.img" [alt]="project.title" />
        <div class="hero-bottom-fade"></div>
      </div>

      <!-- Close -->
      <button class="close-btn" (click)="closeModal()" aria-label="Close">
        <ng-icon name="ionClose"></ng-icon>
      </button>

      <!-- Content -->
      <div class="sheet-content">

        <div class="sheet-header">
          <h1 class="sheet-title">{{project.title}}</h1>
          @if (project.url) {
            <a class="visit-btn" [href]="project.url" target="_blank" rel="noopener noreferrer">
              <ng-icon name="ionGlobeOutline"></ng-icon>
              Visitar
            </a>
          }
        </div>

        <div class="sheet-divider"></div>

        <p class="sheet-description">{{project.description}}</p>

        <div class="sheet-stack">
          <span class="stack-label">STACK</span>
          <div class="stack-grid">
            @for (tec of project.stack; track trackByFn($index, tec)) {
              <div class="tec">
                @if (getSkillIcon(tec)) {
                  <ng-icon [name]="getSkillIcon(tec)" [color]="getSkillColor(tec)"></ng-icon>
                }
                <p>{{tec}}</p>
              </div>
            }
          </div>
        </div>

      </div>
    </div>
  </div>
}
